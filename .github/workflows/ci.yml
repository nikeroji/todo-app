name: Todo App CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-and-build:
    name: Проверка и сборка проекта
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Получение исходного кода
        uses: actions/checkout@v7

      - name: Настройка Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            microservices/tasks_service/requirements.txt

      - name: Установка зависимостей
        run: python -m pip install -r requirements-dev.txt

      - name: Проверка кода Flake8
        run: python -m flake8 microservices tests --count --statistics

      - name: Запуск юнит-тестов
        run: python -m pytest -q tests

      - name: Сборка Docker-образов
        run: |
          docker build -t todo-tasks:ci ./microservices/tasks_service
          docker build -t todo-users:ci ./microservices/users_service
          docker build -t todo-notifications:ci ./microservices/notification_service
          docker build -t todo-frontend:ci ./frontend